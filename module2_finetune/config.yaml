# Module 2 — Fine-Tuning Configuration
# ======================================
# This configuration controls the fine-tuning pipeline.
# Change values here without modifying any Python files.

# ── Dataset ────────────────────────────────────────────────────────────────
data:
  processed_dir: "../data/processed"
  splits_dir:    "../data/splits"
  vocabulary:    "../data/vocabulary.json"
  sequence_length: 30
  feature_dim:     258
  num_classes:     13          # informational: read from vocabulary.json at run time

# ── Starting point ──────────────────────────────────────────────────────────
pretrained:
  path: "../models/refined/best_model.h5"
  # Can also point to any module1 output or scaffold weights
  architecture: "bilstm"      # lstm | bilstm | gru | transformer

# ── Fine-tuning strategy ────────────────────────────────────────────────────
finetune:
  # Number of encoder layers to freeze (0 = train all from start)
  frozen_layers: 0
  # Layer-wise learning rate decay (discriminative fine-tuning)
  layer_lr_decay: 0.85        # each lower layer gets lr * decay^depth

  # Main training
  epochs: 80                  # early stopping usually ends it around 50-70
  batch_size: 16
  learning_rate: 5.0e-4

  # Comparatively evaluate ALL architectures if true
  compare_architectures: true
  architectures_to_compare:
    - lstm
    - bilstm
    - gru
    - transformer

# ── Output ──────────────────────────────────────────────────────────────────
output:
  model_dir:  "../models/finetuned"
  best_model: "best_model.h5"
  logs_dir:   "../logs/finetune"
  results_csv: "comparison_results.csv"

# ── Training ────────────────────────────────────────────────────────────────
training:
  use_augmentation: true
  augmentation:
    # A new augmented copy of every clip each epoch (false: one copy made up front)
    fresh_each_epoch: true
    mirror_prob:   0.5
    noise_std:     0.02    # shoulder widths
    jitter_frames: 3
    speed_min:     0.6     # playback speed
    speed_max:     1.6
    scale_min:     0.85
    scale_max:     1.15
    dropout_prob:  0.1
    # Differences between people: lean / phone angle, wider or taller signing.
    # Leave-one-signer-out over the 4 team signers (3 seeds each): 68.7% with
    # one fixed copy -> 72.9% with these. Hand size (hand_scale_min/max) is left
    # out: adding it too gave 71.6%, and 60.6% instead of 66.1% for s04.
    tilt_degrees:   12
    stretch_x_min:  0.85
    stretch_x_max:  1.15
    stretch_y_min:  0.9
    stretch_y_max:  1.1
  early_stopping_patience: 15
  reduce_lr_patience:       7
  reduce_lr_factor:         0.5
  min_lr:                   1.0e-7
  seed: 42

# ── Evaluation ──────────────────────────────────────────────────────────────
evaluation:
  # Run both signer-dependent and signer-independent evaluation
  signer_dependent:   true
  signer_independent: true
  measure_latency:    true
  latency_warmup:     10
  latency_runs:       100
